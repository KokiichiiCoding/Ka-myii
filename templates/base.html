<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Ka-myii — VTuber Model Studio{% endblock %}</title>

    <link href="/static/vendor/ui/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/static/vendor/ui/fontawesome.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}">
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Crect width='40' height='40' fill='%23cd8e73'/%3E%3Ctext x='9' y='30' font-size='30'%3EK%3C/text%3E%3C/svg%3E">
    {% block extra_css %}{% endblock %}
</head>
<body>
    <nav class="km-nav">
        <a class="km-brand" href="/"><span class="brand-stamp" aria-hidden="true">K<span>m</span></span> Ka-myii</a>
        <div class="km-tabs">
            <a class="km-tab {% block tab_home %}{% endblock %}" href="/"><i class="fas fa-house"></i> Home</a>
            <a class="km-tab {% block tab_studio %}{% endblock %}" href="/generator"><i class="fas fa-wand-magic-sparkles"></i> Studio</a>
            <a class="km-tab {% block tab_gallery %}{% endblock %}" href="/gallery"><i class="fas fa-images"></i> Gallery</a>
        </div>
        <div class="spacer"></div>
        <span class="km-pill" id="navModelStatus" title="Generation backend status">
            <span class="led" id="navLed"></span>
            <span id="navModelText">checking…</span>
        </span>
    </nav>

    <main>
        {% block content %}{% endblock %}
    </main>

    <footer class="km-foot">
        Ka-myii <span>Character workshop / Made on your machine</span>
    </footer>

    <script src="/static/vendor/ui/bootstrap.bundle.min.js"></script>
    <script src="/static/vendor/ui/axios.min.js"></script>
    <script src="/static/vendor/ui/socket.io.min.js"></script>
    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
    {% block extra_js %}{% endblock %}

    <script>
    // Global backend status indicator in the nav.
    (async function () {
        try {
            const { data } = await axios.get('/api/generation/model-status');
            const led = document.getElementById('navLed');
            const txt = document.getElementById('navModelText');
            if (data.is_dummy) { led.className = 'led demo'; txt.textContent = 'Demo mode'; }
            else if (data.model_loaded) { led.className = 'led on'; txt.textContent = (data.device || '').toUpperCase() + ' ready'; }
            else { led.className = 'led'; txt.textContent = 'Ready on demand'; }
        } catch (e) {
            const txt = document.getElementById('navModelText');
            if (txt) txt.textContent = 'offline';
        }
    })();
    </script>
</body>
</html>
