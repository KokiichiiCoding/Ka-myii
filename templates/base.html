<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Ka-myii — VTuber Model Studio{% endblock %}</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}">
    {% block extra_css %}{% endblock %}
</head>
<body>
    <nav class="km-nav">
        <a class="km-brand" href="/"><span class="dot"></span> Ka-myii</a>
        <div class="km-tabs">
            <a class="km-tab {% block tab_home %}{% endblock %}" href="/"><i class="fas fa-house"></i> Home</a>
            <a class="km-tab {% block tab_studio %}{% endblock %}" href="/generator"><i class="fas fa-wand-magic-sparkles"></i> Studio</a>
            <a class="km-tab {% block tab_gallery %}{% endblock %}" href="/gallery"><i class="fas fa-images"></i> Gallery</a>
        </div>
        <div class="spacer"></div>
        <span class="km-pill" id="navModelStatus" title="Generation backend status">
            <span class="led" id="navLed"></span>
            <span id="navModelText">checking…</span>
        </span>
    </nav>

    <main>
        {% block content %}{% endblock %}
    </main>

    <footer class="km-foot">
        Ka-myii · Automated VTuber Model Studio · generate → decompose → rig-ready Live2D
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
    {% block extra_js %}{% endblock %}

    <script>
    // Global backend status indicator in the nav.
    (async function () {
        try {
            const { data } = await axios.get('/api/generation/model-status');
            const led = document.getElementById('navLed');
            const txt = document.getElementById('navModelText');
            if (data.is_dummy) { led.className = 'led demo'; txt.textContent = 'Demo mode'; }
            else if (data.model_loaded) { led.className = 'led on'; txt.textContent = (data.device || '').toUpperCase() + ' ready'; }
            else { led.className = 'led'; txt.textContent = 'Model not loaded'; }
        } catch (e) {
            const txt = document.getElementById('navModelText');
            if (txt) txt.textContent = 'offline';
        }
    })();
    </script>
</body>
</html>
