name: tests

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # The suite is GPU-free: demo mode plus monkeypatched See-through, so no torch is needed.
      - run: python -m pip install Flask Pillow numpy psd-tools pytoshop six python-dotenv pytest
      # Browser journeys (tests/e2e) on Linux only; elsewhere they skip without a browser.
      - if: runner.os == 'Linux'
        run: python -m pip install playwright==1.47.0 && python -m playwright install --with-deps chromium
      - run: python -m pytest tests -q -rs
      - run: node tests/preview_runtime.test.cjs
      - run: node tests/tagcomplete.test.cjs
